[project]
authors = [{name = "Clement Sebastiao", email = "clement.sebastiao@protonmail.com"}]
dependencies = []
name = "paris_orderbike"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ['conda-forge']
platforms = ['osx-arm64']

[tool.pixi.pypi-dependencies]
paris_orderbike = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
osmnx = ">=2.2.0,<3"
momepy = ">=1.0.0,<2"
neatnet = ">=0.1.6,<0.2"
jupyter = ">=1.1.1,<2"
pre-commit = ">=4.7.0,<5"
python-igraph = ">=1.0.0,<2"
